name: Release

# 推送 v* 格式的 tag 时，自动构建 Windows NSIS 安装包并发布为 GitHub Release。
# 用法：git tag -a v0.1.0 -m "版本说明" && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck

      - name: Build & Package (Windows NSIS)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 不签名（跳过代码签名，避免需要证书）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          if-no-files-found: error

  release:
    needs: [build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 必须 checkout：发布说明取自仓库里的 docs/release-notes.md，
      # 不 checkout 的话该文件不在工作区 → Release 正文会静默变成空（v0.3.0 首次发布踩过）。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: win-installer
          path: dist/

      # 用 runner 自带的 gh CLI 建/更新 Release：`--notes-file` 直接读仓库里的文件，
      # 不再经 action 的 body/body_path 传参（那条路实测三次都出成空正文，原因不明但不可依赖）。
      # 已存在同 tag 的 Release 就改正文 + 覆盖资产，不存在就新建。
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "notes file: $(wc -c < docs/release-notes.md) bytes"
          ls -l dist/
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists → updating notes"
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file docs/release-notes.md \
              --latest
          else
            echo "creating release $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file docs/release-notes.md \
              --latest
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release view "$GITHUB_REF_NAME" --json name,tagName,isDraft,isPrerelease,assets \
            -q '"published: " + .tagName + " assets=" + ([.assets[].name] | join(","))'
