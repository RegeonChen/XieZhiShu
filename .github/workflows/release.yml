name: Release

# 推送 v* 格式的 tag 时，自动构建 Windows NSIS 安装包，作为 **CI 产物（workflow artifact）** 保留备查。
#
# ⚠️ 2026-11-11（实测事故后收紧）：**CI 不再自动创建/覆盖 GitHub Release 资产**。
# 原因有两条，都实测踩过：
#  ① `resources/models/` 在 .gitignore 里、**不在仓库中** → CI 打出的安装包**不含本地嵌入模型**
#     （约 90 MB），用户装上后语义检索会静默退化成纯词法检索；
#  ② 用 API 创建 release（tag 自动出现）同样会触发本工作流，`softprops/action-gh-release`
#     的 `overwrite_files: true` 会把**本地构建的正确安装包覆盖成 CI 的无模型包**——
#     实测 v0.4.1 / v0.5.0 的资产就被换成了 200.6 MB 的无模型包（正确包分别是 340.5 / 352.7 MB）。
#
# 正式发布口径（见 AGENTS.md）：**本地** `npm run dist:win` → 用 API 建 release → 只上传当前版本的
# exe 与 .blockmap 两个文件。CI 只负责"能编译通过 + 产物备查"。
on:
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck

      - name: Build & Package (Windows NSIS)
        run: npm run dist:win
        env:
          # 不签名（跳过代码签名，避免需要证书）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          if-no-files-found: error
