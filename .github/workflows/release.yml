name: Release

# 推送 v* 格式的 tag 时，自动构建 Windows NSIS 安装包并发布为 GitHub Release。
# 用法：git tag -a v0.1.0 -m "版本说明" && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck
        run: npm run typecheck

      - name: Build & Package (Windows NSIS)
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 不签名（跳过代码签名，避免需要证书）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
          if-no-files-found: error

  release:
    needs: [build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 必须 checkout：发布说明取自仓库里的 docs/release-notes.md，
      # 不 checkout 的话该文件不在工作区 → Release 正文会静默变成空（v0.3.0 首次发布踩过）。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: win-installer
          path: dist/

      # 发布说明读进 output 再作为 body 传（`body_path` 实测在本 action 上没生效，
      # v0.3.0 头两次发布都出成了空正文——这里改成显式读取，并打印首行便于核对）。
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          echo "release notes: $(wc -c < docs/release-notes.md) bytes"
          head -3 docs/release-notes.md
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat docs/release-notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          body: ${{ steps.notes.outputs.body }}
          # 同一 tag 重跑时覆盖已上传的同名安装包（否则重发会因资产重名失败）
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
